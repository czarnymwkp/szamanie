name: CI/CD - Build and push image

# pull requests: build only (no VPN, no secrets, no push); main and manual runs: build and push
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch: {}

# consecutive pushes to main (or to a PR) don't build in parallel — the newest one wins
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: registry.tools.bngdev.com
  DOCKER_REPOSITORY: registry
  DOCKER_IMAGE_NAME: szamanie

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      PUSH_IMAGE: ${{ github.event_name != 'pull_request' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # the registry admits only the home network and the VPN: the job joins the VPN as its own peer
      # (WIREGUARD_CONFIG: a full wg0.conf without a DNS line, see README)
      - name: Connect to VPN
        if: env.PUSH_IMAGE == 'true'
        env:
          WIREGUARD_CONFIG: ${{ secrets.WIREGUARD_CONFIG }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq wireguard-tools
          echo "$WIREGUARD_CONFIG" | sudo tee /etc/wireguard/wg0.conf > /dev/null
          sudo chmod 600 /etc/wireguard/wg0.conf
          sudo wg-quick up wg0
          # the router's DNS resolves *.tools.bngdev.com to minis' LAN address; other names stay on the runner's DNS
          sudo resolvectl dns wg0 10.0.0.1
          sudo resolvectl domain wg0 '~tools.bngdev.com'

      - name: Check registry is reachable
        if: env.PUSH_IMAGE == 'true'
        run: |
          code=$(curl -sS -o /dev/null -w '%{http_code}' --retry 5 --retry-all-errors --max-time 10 "https://$DOCKER_REGISTRY/v2/")
          echo "https://$DOCKER_REGISTRY/v2/ answered $code"
          test "$code" = 401

      # host network: BuildKit pushes through the VPN and uses the host's DNS
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          driver-opts: network=host

      - name: Login to Docker Registry
        if: env.PUSH_IMAGE == 'true'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}
          # latest only from main; manual runs from other branches push just the sha tag
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ env.PUSH_IMAGE == 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # shown publicly on the site (/polityka-prywatnosci, /dla-lokali), so repository variables, not secrets
          build-args: |
            ADMINISTRATOR=${{ vars.ADMINISTRATOR }}
            CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://szamanie.pl' }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Disconnect from VPN
        if: always() && env.PUSH_IMAGE == 'true'
        run: sudo wg-quick down wg0 || true
