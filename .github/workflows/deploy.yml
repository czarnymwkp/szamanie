name: CD - Build and push image

on:
  push:
    branches: [main]
  workflow_dispatch: {}

# consecutive pushes to main don't build in parallel — the newest one gets the latest tag
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  DOCKER_REGISTRY: registry.tools.bngdev.com
  DOCKER_REPOSITORY: registry
  DOCKER_IMAGE_NAME: szamanie

jobs:
  build-and-push:
    # GitHub runner in minis' Runner VM (server-provisioning, role github_runner): the registry admits only
    # the home network, the VPN and the CI Network, so GitHub-hosted runners can't reach it
    runs-on: [self-hosted, minis]
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Login to Docker Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.DOCKER_REGISTRY }}
          username: ${{ secrets.DOCKER_REGISTRY_USERNAME }}
          password: ${{ secrets.DOCKER_REGISTRY_PASSWORD }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_REGISTRY }}/${{ env.DOCKER_REPOSITORY }}/${{ env.DOCKER_IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,format=long,prefix=

      # the VM's own Docker builder: its layer cache stays on the runner between builds
      - name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # shown publicly on the site (/polityka-prywatnosci, /dla-lokali), so repository variables, not secrets
          build-args: |
            ADMINISTRATOR=${{ vars.ADMINISTRATOR }}
            CONTACT_EMAIL=${{ vars.CONTACT_EMAIL }}
            NEXT_PUBLIC_SITE_URL=${{ vars.NEXT_PUBLIC_SITE_URL || 'https://szamanie.pl' }}

      # the runner is persistent and its Docker is shared with the Forgejo runner: drop the pushed tags (the build
      # cache stays), so images don't pile up on the VM's disk
      - name: Remove local image tags
        if: always()
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: echo "$TAGS" | xargs -r docker image rm || true
