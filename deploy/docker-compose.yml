# On the server: /opt/szamanie/app (code, replaced on every deployment), /opt/szamanie/data (database — stays),
# /opt/szamanie/.env (settings). Started by deploy/deploy.sh; by hand: cd /opt/szamanie/app && docker compose -f deploy/docker-compose.yml up -d --build
name: szamanie

services:
  app:
    build: ..
    image: szamanie-app
    restart: unless-stopped
    env_file:
      - path: ../../.env
        required: false
    volumes:
      - ../../data:/app/data
    # only for Caddy (internal network) and for checks from the server itself: curl localhost:3000
    ports:
      - "127.0.0.1:3000:3000"

  # HTTPS with an automatic Let's Encrypt certificate for szamanie.pl (www → without www)
  caddy:
    image: caddy:2
    restart: unless-stopped
    depends_on:
      - app
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      DOMENA: ${DOMENA:-szamanie.pl}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  caddy_data:
  caddy_config:
